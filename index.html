<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mustafa Fit</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--mut:#566574;--navy:#10263d;--ac:#e8590c;--ln:#d3dbe3;--okb:#ebf8ee;--acb:#fff1e6;--in:#eef2f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#162331;--ink:#e6edf3;--mut:#9fb0c0;--navy:#1c3d5f;--ln:#2a3b4c;--okb:#12301b;--acb:#3a2414;--in:#0f1b27}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#162331;--ink:#e6edf3;--mut:#9fb0c0;--navy:#1c3d5f;--ln:#2a3b4c;--okb:#12301b;--acb:#3a2414;--in:#0f1b27}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 'DejaVu Sans',system-ui,'Segoe UI',Tahoma,sans-serif;padding-bottom:84px}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px}header small{display:block;opacity:.8;font-size:12px}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px;border-right:5px solid var(--ac);padding-right:9px}
.sm{font-size:12px;color:var(--mut)}.l{direction:ltr;unicode-bidi:isolate;display:inline-block}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font:inherit;font-size:11px}
nav button.on{color:var(--ac);font-weight:bold}nav span{display:block;font-size:20px;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:20px;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:bold}
input,textarea,select{background:var(--in);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;width:100%}
.sets{display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;align-items:center;margin-top:6px;text-align:center}
.tip{background:var(--acb);border-radius:8px;padding:6px 10px;font-size:12.5px;margin-top:6px}
.ok{background:var(--okb);border-radius:8px;padding:8px 10px;margin:8px 0}
.bar{height:10px;background:var(--in);border-radius:6px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
.m{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.m input{width:22px;height:22px}.m div{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details summary{font-weight:bold;cursor:pointer}
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;white-space:pre-wrap}.u{background:var(--in)}.a{background:var(--okb)}
svg{width:100%;height:auto}svg text{fill:var(--mut);font-size:10px}
.ex{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}.ex img{width:100%;max-height:180px;object-fit:contain;background:#fff;border-radius:8px}.tmr{position:fixed;bottom:76px;left:12px;background:var(--ac);color:#fff;padding:10px 16px;border-radius:24px;z-index:9;font-weight:bold}a.chip{text-decoration:none}
</style></head><body>
<header><b>💪 مدرّب مصطفى</b><small id="sub"></small></header>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const T=[["t","🏋️","اليوم"],["p","📋","البرنامج"],["n","🍽️","الأكل"],["g","📈","التقدّم"],["c","🤖","المدرّب"]];
const X={UA:["علوي A",[["بنش دمبلز مائل 30°",3,[6,10],"1-2","ظهر ملتصق، المرفقان 45–60°، نزول 2–3 ثوان"],["سحب بدعم الصدر",3,[8,12],"1-2","المرفقان للجيبين، اعصر الكتفين"],["سحب أمامي",3,[8,12],"1-2","المرفق نحو الأضلاع"],["نشر جانبي",3,[12,20],"0-2","حتى مستوى الكتف، بلا تأرجح"],["فراشة",3,[12,15],"0-1","تمدد كامل ثم اعصر"],["تراي فوق الرأس",3,[10,15],"0-1","تمدد قوي بالتراي"],["كيرل دمبلز مائل",3,[10,12],"0-1","الذراعان خلف الجذع"]]],
LA:["سفلي A",[["ضغط أرجل",4,[8,12],"1-2","≈90° أو أعمق، مسامير الأمان"],["رومانيان ديدلفت",3,[8,10],"2","الحوض للخلف، ظهر محايد"],["فرد الأرجل",3,[12,15],"0-1","نزول 2–3 ثوان"],["كيرل أرجل جالس",3,[10,15],"0-1","بلا زخم"],["سمانة واقفة",4,[8,12],"0-1","توقف ثانيتين بالتمدد"],["كرنش ماكنة",3,[10,15],"1","بلا سحب الرقبة"]]],
UB:["علوي B",[["ضغط كتف جالس",3,[8,12],"1-2","المرفقان أمام الجسم قليلاً"],["سحب جالس",3,[10,12],"1-2","صدر مرفوع"],["ضغط صدر",3,[8,12],"1-2","نزول بطيء"],["سحب محايد",2,[10,12],"1","نفس تقنية A"],["نشر جانبي",3,[12,20],"0-1","بدّل الأداة عن A"],["فراشة عكسية",3,[12,20],"0-1","قُد بالمرفقين"],["تراي بنج داون",2,[10,15],"0-1","المرفقان ملاصقان"],["كيرل لاري/هامر",2,[10,12],"0-1","تحكم بالنزول"]]],
LB:["سفلي B",[["سكوات سمث/هاك",3,[8,12],"1-2","فخذان موازيتان أو أعمق"],["هيب ثرست",3,[8,12],"1-2","توقف ثانية بالأعلى"],["كيرل أرجل جالس",3,[10,15],"0-1","بلا زخم"],["فرد الأرجل",2,[12,15],"0-1","اعصر بالأعلى"],["سمانة واقفة",4,[10,15],"0-1","توقف ثانيتين"],["باكارج 45°",3,[10,15],"2","ظهر محايد"],["رفع أرجل معلّق",3,[10,15],"1","بلا تأرجح"]]]};
const K=Object.keys(X);
const WU={U:["دوائر الذراعين 10+10","انزلاق على الجدار 8","ضغط لوحي الكتف 10","دوران الجذع العلوي 6/جهة","دوران خارجي بدمبل خفيف 12/ذراع"],L:["تأرجح الساق 10 أمام/خلف + 10 جانبي","سكوات وزن الجسم 10 (توقف ثانيتين)","انحناء الحوض 10","جسر الألوية 12","حركة الكاحل على الجدار 10/رجل"]};
const M=[["A","الفطور: 3 بيضات + صمونة + جبن",580,31],["B","شيك: حليب + شوفان + موزة + زبدة فستق + تمر",650,23],["C","الغداء: تمن + دجاج + سلطة + زيت",650,38],["D","قبل التمرين: صمونة + زبدة فستق + موزة + حليب",570,20],["E","العشاء: عدس + تمن + لبن",580,30],["F","بديل/إضافة: وعاء شوفان بالحليب + موزة + زبدة فستق",540,20],["G","بديل/إضافة: سندويش تونة (صمونة + علبة تونة + زيت/مايونيز + خيار)",410,33]];
const LV={1:[2450,120,"A B C E"],1.5:[2700,128,"A B C E"],2:[3000,138,"A B C D E"]};
const td=()=>new Date().toLocaleDateString('sv');
let S={lv:1,w:[],log:{},meal:{},x:{},me:[],sel:null,chat:[]},tab="t",doc=null,tm;
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
try{Object.assign(S,JSON.parse(localStorage.getItem('mc')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('mc',JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(()=>{if(doc)doc.set({j:JSON.stringify(S)}).catch(()=>{})},700)}
async function init(){try{const u=await claude.use('user'),id=u&&await u.id(),db=await claude.use('db');if(db&&id){doc=db.collection('data/users/'+id).doc('app');const s=await doc.get();if(s.exists){const d=JSON.parse(s.data().j||'{}');if(d.w&&d.w.length>=S.w.length||Object.keys(d.log||{}).length>=Object.keys(S.log).length){Object.assign(S,d);render()}}save()}}catch(e){}}
const nextKey=()=>{const ds=Object.keys(S.log).sort();const l=ds.length?ds[ds.length-1].split('|')[1]:null;return K[(K.indexOf(l)+1)%4]};
function last(k,i){const ds=Object.keys(S.log).filter(x=>x.split('|')[1]==k&&x.split('|')[0]<td()).sort().reverse();for(const d of ds){const e=(S.log[d].e||{})[i];if(e&&e.some(s=>s&&s[1]>0))return e.filter(s=>s&&s[1]>0)}return null}
function sug(k,i,hi){const L=last(k,i);if(!L)return 'ابدأ بوزن يترك لك 2–3 تكرارات احتياطية.';const kg=Math.max(...L.map(s=>s[0]));return L.every(s=>s[1]>=hi)?`وصلت للحد الأعلى: ارفع الوزن (≈ ${Math.round(kg*1.04*2)/2} كغ)`:`المرة السابقة: ${kg} كغ × ${L.map(s=>s[1]).join('/')}. حاول +1 تكرار.`}
function avg(a,b){const t=Date.now(),r=S.w.filter(x=>{const k=(t-new Date(x.d))/864e5;return k>=a&&k<b});return r.length?r.reduce((s,x)=>s+x.k,0)/r.length:null}
function adv(){const c=avg(0,7),p=avg(7,14);if(c==null||p==null)return["","سجّل وزنك 3–4 صباحات بالأسبوع لأسبوعين متتاليين ليظهر التحليل."];const d=c-p,f=d.toFixed(2);if(d<.15)return[f,"أقل من 0.15 كغ/أسبوع: أضف ≈ 250 سعرة (شيك أو نصف وجبة) وراجع النوم."];if(d<.25)return[f,"أضف ≈ 100–150 سعرة."];if(d<=.6)return[f,"ممتاز، ثبّت على نفس الخطة."];return[f,"أكثر من 0.6 كغ/أسبوع: غالباً دهون زائدة، خفّض ≈ 150–200 سعرة."]}
function wk(){const t=Date.now();return new Set(Object.keys(S.log).filter(k=>(t-new Date(k.split('|')[0]))/864e5<7&&Object.values(S.log[k].e||{}).some(a=>a.some(s=>s&&s[1]>0))).map(k=>k.split('|')[0])).size}
function tot(){const m=S.meal[td()]||{};let k=0,p=0;M.forEach(x=>{if(m[x[0]]){k+=x[2];p+=x[3]}});const c=S.x[td()]||{};return[k+(c.k||0),p+(c.p||0)]}
const V=n=>document.getElementById(n);
function render(){const w=S.w.slice().sort((a,b)=>a.d<b.d?-1:1),lw=w.length?w[w.length-1].k:null;V('sub').innerHTML=`أسبوع التمرين: <span class=l>${wk()}/4</span> جلسات • ${lw?'آخر وزن: <span class=l>'+lw+'</span> كغ • الهدف <span class=l>70-75</span>':'ابدأ بتسجيل وزنك'}`;
V('nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
V('v').innerHTML=({t:vT,p:vP,n:vN2,g:vG2,c:vC2})[tab]();if(tab=='g')drawW();deco();}
function vT(){const k=S.sel||nextKey(),[n,ex]=X[k],id=td()+'|'+k,L=(S.log[id]||{e:{}}).e,u=k[0]=='U';
return`<div class=chips>${K.map(x=>`<button class="chip ${x==k?'on':''}" data-s="${x}">${X[x][0]}</button>`).join('')}</div>
<div class=card><details><summary>🔥 الإحماء (8–10 دقائق)</summary><p class=sm>3–5 د مشي/دراجة خفيفة، ثم:</p><ul>${WU[u?'U':'L'].map(x=>`<li>${x}</li>`).join('')}</ul><div class=tip>أول تمرين: 50% × 10–12 ← 70% × 6 ← 85% × 3 ثم مجموعات العمل. بدون فشل.</div></details></div>`+
ex.map((e,i)=>`<div class=card><b>${i+1}. ${e[0]}</b><div class=sm>${e[1]} مجموعات × <span class=l>${e[2][0]}-${e[2][1]}</span> • RIR <span class=l>${e[3]}</span></div><div class=tip>💡 ${e[4]}</div><div class=ok style="font-size:13px">📊 ${sug(k,i,e[2][1])}</div>
<div class=sets><span></span><span class=sm>كغ</span><span class=sm>تكرار</span>${Array.from({length:e[1]},(_,j)=>{const s=(L[i]||[])[j]||[];return`<span class=sm>${j+1}</span><input type=number inputmode=decimal step=.5 data-k="${k}" data-i="${i}" data-j="${j}" data-f=0 value="${s[0]||''}"><input type=number inputmode=numeric data-k="${k}" data-i="${i}" data-j="${j}" data-f=1 value="${s[1]||''}">`}).join('')}</div></div>`).join('')+`<p class=sm>يُحفظ تلقائياً. الراحة: 2–3 د للمركّبة، 1.5–2 د للمعزولة.</p>`}
function vP(){return K.map(k=>`<div class=card><h3>${X[k][0]}</h3>${X[k][1].map((e,i)=>`<div class=m><div>${i+1}. ${e[0]}<div class=sm>${e[4]}</div></div><span class=l>${e[1]}×${e[2][0]}-${e[2][1]}</span></div>`).join('')}</div>`).join('')+`<div class=card><h3>القواعد</h3><ul><li>التدرّج المزدوج: زد تكراراً كل جلسة، وعند الحد الأعلى بكل المجموعات ارفع الوزن ≈ 2.5–5%.</li><li>معظم المجموعات 1–2 RIR، آخر مجموعة معزولة 0–1.</li><li>أسبوع 7 و12: تخفيف (نصف المجموعات).</li><li>ألم مفصل حاد أو دوخة: أوقف التمرين.</li></ul></div>`}
function vN(){const[t,p]=tot(),g=LV[S.lv],m=S.meal[td()]||{},c=S.x[td()]||{},wa=S.x[td()+'w']||0;
return`<div class=card><h3>أهداف اليوم</h3><div class=chips>${Object.keys(LV).map(x=>`<button class="chip ${x==S.lv?'on':''}" data-lv="${x}">المستوى ${x}</button>`).join('')}</div>
<div>سعرات: <b class=l>${t}</b> / <span class=l>${g[0]}</span></div><div class=bar><i style="width:${Math.min(100,t/g[0]*100)}%"></i></div><div>بروتين: <b class=l>${p}</b> / <span class=l>${g[1]}</span> غ</div><div class=bar><i style="width:${Math.min(100,p/g[1]*100)}%"></i></div>
<div class=sm>المستوى ${S.lv}: الوجبات ${g[2]}. يمكنك استبدال وجبة بالشوفان (F) أو التونة (G) أو إضافتهما إذا احتجت سعرات. كل بالساعة وليس بالجوع.</div></div>
<div class=card><h3>الوجبات</h3>${M.map(x=>`<label class=m><input type=checkbox data-m="${x[0]}" ${m[x[0]]?'checked':''}><div><b>${x[0]}</b> • ${x[1]}<div class=sm><span class=l>${x[2]}</span> سعرة • <span class=l>${x[3]}</span> غ بروتين</div></div></label>`).join('')}
<div class=g2 style="margin-top:8px"><input type=number inputmode=numeric placeholder="سعرات إضافية" data-c="k" value="${c.k||''}"><input type=number inputmode=numeric placeholder="بروتين إضافي" data-c="p" value="${c.p||''}"></div></div>
<div class=card><h3>💧 الماء</h3><div class=chips>${Array.from({length:10},(_,i)=>`<button class="chip ${i<wa?'on':''}" data-wa="${i+1}">${i+1}</button>`).join('')}</div><div class=sm>الهدف حوالي 10 أكواب. بدون مشروبات طاقة.</div></div>
<div class=card><h3>للشهية الضعيفة</h3><ul><li>اشرب سعراتك: الشيك 500–650 سعرة.</li><li>أضف ملعقة زيت أو زبدة فستق أو راشي.</li><li>الماء بين الوجبات لا معها.</li><li>لا تؤجّل الفطور.</li></ul></div>`}
function vG(){const[d,m]=adv(),r=S.me.slice(-1)[0]||{},f=S.me[0];
return`<div class=card><h3>الوزن</h3><div class=g2><input id=wk type=number inputmode=decimal step=.1 placeholder="وزن اليوم (كغ)"><button class=p data-addw>حفظ</button></div>
<div class=ok>${d?`التغيّر الأسبوعي: <b class=l>${d>0?'+':''}${d}</b> كغ<br>`:''}${m}</div><svg id=ch viewBox="0 0 320 150"></svg><p class=sm>المعدل الأسبوعي أهم من الرقم اليومي. وزن بعد الحمام وقبل الأكل.</p></div>
<div class=card><h3>القياسات (كل 4 أسابيع)</h3><div class=g2>${[["wa","الخصر"],["ch","الصدر"],["ar","الذراع"],["th","الفخذ"],["sh","الكتفان"]].map(x=>`<input type=number inputmode=decimal step=.5 id=m_${x[0]} placeholder="${x[1]} سم" value="${r[x[0]]||''}">`).join('')}<button class=p data-addm>حفظ</button></div>
<p class=sm>${S.me.length?`آخر قياس: ${r.d}`+(f&&f!==r?` • الأول: ${f.d}`:''):'لا توجد قياسات بعد'}. صوّر نفسك (أمام/جانب/خلف) بنفس الإضاءة كل 4 أسابيع.</p></div>
<div class=card><h3>الأسابيع</h3><div>جلسات آخر 7 أيام: <b class=l>${wk()}/4</b></div><div class=sm>تخفيف في الأسبوع 7 و12. بعد 12 أسبوعاً اطلب من المدرّب بلوكاً جديداً.</div></div>`}
function drawW(){const w=S.w.slice().sort((a,b)=>a.d<b.d?-1:1).slice(-30),s=V('ch');if(!s)return;if(w.length<2){s.innerHTML='<text x=160 y=75 text-anchor=middle>سجّل وزنين على الأقل</text>';return}
const lo=Math.min(50,...w.map(x=>x.k))-1,hi=Math.max(76,...w.map(x=>x.k))+1,y=v=>135-(v-lo)/(hi-lo)*120,x=i=>20+i*(290/(w.length-1));
s.innerHTML=`<rect x=20 y=${y(75)} width=290 height=${y(70)-y(75)} fill="#2b8a3e" opacity=.18 /><polyline fill=none stroke="#e8590c" stroke-width=2.5 points="${w.map((p,i)=>x(i)+','+y(p.k)).join(' ')}"/>`+w.map((p,i)=>`<circle cx=${x(i)} cy=${y(p.k)} r=2.8 fill="#e8590c"/>`).join('')+`<text x=2 y=${y(75)+3}>75</text><text x=2 y=${y(70)+3}>70</text>`}
function vC(){return`<div class=card><h3>🤖 المدرّب الذكي</h3><p class=sm>يرى أوزانك وتمارينك وأكلك المسجّلة. ليس طبيباً، وللأعراض راجع طبيباً.</p><div class=chips>${["حلّل أسبوعي","عدّل سعراتي","ما التمرين الذي أركّز عليه؟","بديل لتمرين لا أحسّ به"].map(q=>`<button class=chip data-q="${q}">${q}</button>`).join('')}</div>
<div id=cl>${S.chat.map(m=>`<div class="msg ${m.r=='u'?'u':'a'}">${E(m.t)}</div>`).join('')}</div><textarea id=q rows=2 placeholder="اسأل مدرّبك..."></textarea><div style="margin-top:8px"><button class=p data-ask>إرسال</button></div></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.t){tab=d.t;render();window.scrollTo(0,0)}else if(d.s){S.sel=d.s;render()}else if(d.lv){S.lv=+d.lv;save();render()}
else if(d.wa){const k=td()+'w';S.x[k]=S.x[k]==+d.wa?+d.wa-1:+d.wa;save();render()}
else if('addw' in d){const v=parseFloat(V('wk').value);if(v>20&&v<200){S.w=S.w.filter(x=>x.d!=td());S.w.push({d:td(),k:v});save();render()}}
else if('addm' in d){const o={d:td()};['wa','ch','ar','th','sh'].forEach(k=>{const v=parseFloat(V('m_'+k).value);if(v)o[k]=v});S.me.push(o);save();render()}

async function net(){try{const N=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Network;if(N){const s=await N.getStatus();return s.connected?s.connectionType:'none'}}catch(e){}const c=navigator.connection;return navigator.onLine?(c&&c.type)||'wifi':'none'}
async function okNet(){const t=await net();if(t=='none'){alert('لا يوجد إنترنت');return false}if(S.cfg.wifi&&t=='cellular'){alert('هذه الميزة تعمل عبر WiFi فقط. يمكنك تغيير ذلك من الإعدادات.');return false}return true}
let DB=null;async function exdb(){if(DB)return DB;try{DB=JSON.parse(localStorage.getItem('exdb')||'null')}catch(e){}if(DB)return DB;const t=await net();if(t=='none'||(S.cfg.wifi&&t=='cellular'))return[];try{const j=await(await fetch('https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json')).json();DB=j.map(x=>({n:x.name.toLowerCase(),i:x.images||[]}));try{localStorage.setItem('exdb',JSON.stringify(DB))}catch(e){}}catch(e){DB=[]}return DB}

async function deco(){if(tab!='t')return;const k=S.sel||nextKey(),cs=[...document.querySelectorAll('#v>.card')].slice(1),db=await exdb();cs.forEach((c,i)=>{const q=EN[k][i],m=mt(q,db),d=document.createElement('div');d.innerHTML=`<div class=ex>${m?`<img data-i="${m.i.join('|')}" src="${U+m.i[0]}" alt="">`:'<span class=sm>الصورة تظهر عند الاتصال بـ WiFi</span>'}<a class=chip href="https://www.youtube.com/results?search_query=${encodeURIComponent(q+' proper form')}" target=_blank rel=noopener>▶ فيديو الشرح</a><button class=chip data-rt=90>⏱ 90ث</button><button class=chip data-rt=150>⏱ 150ث</button></div>`;if(c.children[1])c.children[1].after(d.firstChild)})}

let rt=null;function timer(n){clearInterval(rt);let t=n,el=V('tm');if(!el){el=document.createElement('div');el.id='tm';el.className='tmr';document.body.append(el)}rt=setInterval(()=>{el.textContent='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(--t<0){clearInterval(rt);el.textContent='✅ ابدأ المجموعة';navigator.vibrate&&navigator.vibrate([300,150,300]);setTimeout(()=>el.remove(),4000)}},1000)}
function b64(f){return new Promise(r=>{if(!f.type.startsWith('image')){const fr=new FileReader();fr.onload=()=>r({mimeType:f.type,data:fr.result.split(',')[1]});fr.readAsDataURL(f);return}const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r({mimeType:'image/jpeg',data:c.toDataURL('image/jpeg',.8).split(',')[1]})};im.src=URL.createObjectURL(f)})}
async function gem(txt,files,json){if(!S.cfg.k){alert('أضف مفتاح Gemini من تبويب المدرّب ← الإعدادات');return null}if(!await okNet())return null;const parts=[];for(const f of files){if(f.size>15e6)throw new Error('الملف أكبر من 15MB');parts.push({inlineData:await b64(f)})}parts.push({text:txt});
for(const m of[S.cfg.m,'gemini-3.6-flash','gemini-2.5-flash']){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.cfg.k},body:JSON.stringify({contents:[{parts}],generationConfig:json?{responseMimeType:'application/json'}:{}})});if(r.status==404)continue;const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j.candidates[0].content.parts.map(p=>p.text||'').join('')}throw new Error('النموذج غير متاح، غيّره من الإعدادات')}
function showM(id){const m=S.pm,t=m.items.reduce((a,x)=>({k:a.k+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});S.pm.t=t;V(id).innerHTML=m.items.map(x=>`<div>• ${E(x.name)} ≈ <span class=l>${x.grams}</span>غ — <span class=l>${x.kcal}</span> سعرة</div>`).join('')+`<div class=ok><b>الإجمالي: <span class=l>${Math.round(t.k)}</span> سعرة • بروتين <span class=l>${Math.round(t.p)}</span> • كربو <span class=l>${Math.round(t.c)}</span> • دهون <span class=l>${Math.round(t.f)}</span></b><br>${E(m.note||'')}</div><button class=p data-addf>أضف لليوم</button><div class=sm>تقدير تقريبي، صحّحه بالنص وأعد التحليل إذا لزم.</div>`}
async function meal(){const f=[...V('mf').files],t=V('mt').value.trim();if(!f.length&&!t)return;const o=V('mo');o.textContent='… جاري التحليل';try{const r=await gem(`حلّل الوجبة (الصور و/أو الوصف: ${t}). الأكل غالباً عراقي (تمن، مرق، صمون، عدس، دولمة...). قدّر بواقعية الأوزان والسعرات والماكروز. أجب JSON فقط: {"items":[{"name":"","grams":0,"kcal":0,"p":0,"c":0,"f":0}],"note":""}`,f,1);if(r==null){o.textContent='';return}const j=JSON.parse(r.replace(/```json|```/g,''));S.pm={items:j.items.map(x=>({name:String(x.name),grams:+x.grams||0,kcal:+x.kcal||0,p:+x.p||0,c:+x.c||0,f:+x.f||0})),note:j.note};showM('mo')}catch(e){o.textContent='تعذّر التحليل: '+(e.message||e)}}
async function bar(code){const o=V('bo');if(!code||!await okNet())return;o.textContent='…';try{const r=await(await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,nutriments`)).json();if(r.status!=1)throw 0;const n=r.product.nutriments,g=+V('bg').value||100,f=g/100;S.pm={items:[{name:r.product.product_name||code,grams:g,kcal:Math.round((n['energy-kcal_100g']||0)*f),p:Math.round((n.proteins_100g||0)*f),c:Math.round((n.carbohydrates_100g||0)*f),f:Math.round((n.fat_100g||0)*f)}],note:'من قاعدة Open Food Facts'};showM('bo')}catch(e){o.textContent='لم أجد المنتج. جرّب تحليل صورة الوجبة.'}}
function dayK(d){const m=S.meal[d]||{},c=S.x[d]||{};let k=0;M.forEach(x=>{if(m[x[0]])k+=x[2]});return k+(c.k||0)}
function adh(){const t=Date.now(),ds=[...Array(7)].map((_,i)=>new Date(t-i*864e5).toLocaleDateString('sv')),md=ds.filter(d=>dayK(d)>=LV[S.lv][0]*.85).length,wi=S.w.filter(x=>ds.includes(x.d)).length,s=wk(),sc=Math.round(Math.min(1,s/4)*50+Math.min(1,md/6)*30+Math.min(1,wi/3)*20),wn=Math.floor((t-new Date(S.start))/6048e5)+1,ph=wn<=2?'تأقلم (RIR 3، مجموعات أقل)':wn<=6?'بناء':wn==7?'تخفيف':wn<=11?'دفع: أضف مجموعة للأولويات':wn==12?'تخفيف + تقييم':'بلوك جديد: اطلب من المدرّب';return{sc,s,md,wi,wn,ph}}

function vN2(){const fl=S.fl.filter(x=>x.d==td());return vN()+`<div class=card><h3>📷 حلّل وجبتك بالذكاء (Gemini)</h3><input id=mf type=file accept="image/*" multiple><textarea id=mt rows=2 placeholder="وصف أو تصحيح (مثال: التمن كوبان والدجاج مشوي)"></textarea><div style="margin-top:8px"><button class=p data-meal>تحليل</button></div><div id=mo class=sm></div></div><div class=card><h3>🔎 باركود / منتج</h3><div class=g2><input id=bc inputmode=numeric placeholder="رقم الباركود"><input id=bg type=number inputmode=numeric placeholder="غرام" value=100></div><div style="margin-top:8px"><button class=p data-bar>بحث</button> <input id=bp type=file accept="image/*" style="width:auto"></div><div id=bo class=sm></div></div><div class=card><h3>مأكولات اليوم</h3>${fl.length?fl.map(x=>`<div class=m><div>${E(x.n)}<div class=sm><span class=l>${x.k}</span> سعرة • <span class=l>${x.p}</span> غ بروتين</div></div></div>`).join(''):'<div class=sm>لا شيء بعد</div>'}</div>`}
